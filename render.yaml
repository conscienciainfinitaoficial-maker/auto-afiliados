services:
  - type: web
    name: auto-afiliados
    runtime: node
    repo: https://github.com/conscienciainfinitaoficial-maker/auto-afiliados
    branch: main
    buildCommand: ""
    startCommand: node server-lead-capture.cjs
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_TO_NUMBER
        sync: false
